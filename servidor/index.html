<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A abrir servidor — Barcelos Hoje</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f2f9f7;color:#0f2b2a;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}
  .box{text-align:center;padding:32px 26px;max-width:460px;width:100%;background:#fff;border-radius:22px;border:1px solid #d7e9e4;box-shadow:0 12px 32px rgba(13,148,136,.12)}
  .logo{font-size:3rem}
  h1{font-size:1.3rem;margin:10px 0 6px;color:#0f2b2a}
  p{color:#5b7b76;font-size:.9rem;line-height:1.5;min-height:22px}
  .btn{display:inline-block;margin-top:18px;background:#0d9488;color:#fff!important;text-decoration:none;font-weight:800;padding:13px 30px;border-radius:999px;font-size:.98rem;transition:.2s}
  .btn:active{transform:scale(.96)}
  .raw{margin-top:16px;font-size:.78rem;color:#8aa7a2;word-break:break-all}
  .raw a{color:#0d9488;font-weight:600}
  .err{color:#e11d48;font-size:.85rem}
  small{display:block;margin-top:22px;color:#8aa7a2;font-size:.74rem}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🖥️</div>
    <h1>Servidor</h1>
    <p id="status">A procurar o link atual…</p>
    <a class="btn" id="btn" href="#" style="display:none">Abrir servidor →</a>
    <div class="raw" id="raw"></div>
    <small>Barcelos Hoje · se o botão não abrir, toca no link direto em baixo</small>
  </div>
  <script>
    (function () {
      var status = document.getElementById('status');
      var btn = document.getElementById('btn');
      var raw = document.getElementById('raw');
      function baseSemBarra(u) { return u.replace(/\/+$/, ''); }
      function mostra(u) {
        var dest = baseSemBarra(u) + '/app/servidor';
        btn.href = dest;
        btn.style.display = 'inline-block';
        raw.innerHTML = 'Link direto: <a href="' + dest + '" target="_blank" rel="noopener">' + dest.replace(/^https?:\/\//, '') + '</a>';
        status.textContent = 'A redirecionar automaticamente…';
        try { location.replace(dest); } catch (e) {}
        setTimeout(function () { try { location.href = dest; } catch (e) {} }, 1600);
      }
      function falha() {
        status.innerHTML = '<span class="err">Não encontrei o link do servidor.</span>';
        btn.style.display = 'none';
        raw.innerHTML = 'Volta ao <a href="https://phsverdadeiros01-maker.github.io">site</a> e pede ajuda ao administrador.';
      }
      fetch('../admin/link.json?t=' + Date.now())
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
          var u = d && d.tunnel && d.tunnel.trim();
          if (!u) throw new Error('sem link');
          mostra(u);
        })
        .catch(falha);
    })();
  </script>
</body>
</html>
