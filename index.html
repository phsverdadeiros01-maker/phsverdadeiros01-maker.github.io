<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joel.dev — Em construção</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#0f1115; color:#e8eaf2; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { text-align:center; max-width:560px; padding:3rem 2rem; }
  .logo { font-size:3rem; margin-bottom:1rem; }
  h1 { font-size:1.8rem; margin-bottom:.6rem; }
  p { color:#9aa3b2; line-height:1.6; }
  .tag { display:inline-block; margin-top:1.5rem; padding:.4rem .9rem; border:1px solid #2a2f3a; border-radius:999px; font-size:.8rem; color:#7ee0a3; background:#12161c; }
  .bar { width:80px; height:4px; margin:1.2rem auto; background:linear-gradient(90deg,#7ee0a3,#5b8cff); border-radius:2px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🚧</div>
    <h1>Joel.dev</h1>
    <div class="bar"></div>
    <p>Site em construção — em breve por aqui.<br>Feito com ⚡ no Raspberry Pi, com a ajuda do OpenClaw.</p>
    <span class="tag">● pronto para o ar</span>
  </div>
</body>
</html>
