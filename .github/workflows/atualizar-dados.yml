name: Atualizar dados do site

on:
  # A atualização normal corre no Raspberry Pi por systemd às 08:00,
  # 12:00 e 18:00 (Europe/Lisbon). Esta Action fica disponível apenas
  # como recuperação manual para evitar execuções atrasadas/duplicadas.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Atualizar notícias e IPMA
        run: ./atualizar_dados.sh

      - name: Validar dados gerados
        run: |
          python3 - <<'PY'
          import json
          with open('dados.json', encoding='utf-8') as f:
              dados = json.load(f)
          noticias = dados.get('noticias', {})
          for categoria in ('barcelos', 'esposende', 'mundo'):
              if not noticias.get(categoria):
                  raise SystemExit(f'categoria sem notícias: {categoria}')
          if len(dados.get('mar', {}).get('dias', [])) < 3:
              raise SystemExit('previsão marítima insuficiente')
          print('dados.json válido')
          PY

      - name: Publicar alteração
        env:
          TZ: Europe/Lisbon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados.json
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar"
            exit 0
          fi
          git commit -m "Atualização automática dados $(date '+%d/%m %H:%M')"
          git push
